<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Official Microsoft Windows App Deep Azure/Cobalt) -->
    <linearGradient id="bgGrad" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0086F0"/>
      <stop offset="45%" stop-color="#0067B8"/>
      <stop offset="100%" stop-color="#003B6F"/>
    </linearGradient>

    <!-- Top-Left Pane (Cyan to Azure) -->
    <linearGradient id="paneTL" x1="60" y1="60" x2="124" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60E6FF"/>
      <stop offset="100%" stop-color="#00A4EF"/>
    </linearGradient>

    <!-- Top-Right Pane (Azure to Microsoft Blue) -->
    <linearGradient id="paneTR" x1="132" y1="60" x2="196" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A4EF"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>

    <!-- Bottom-Left Pane (Microsoft Blue to Deep Blue) -->
    <linearGradient id="paneBL" x1="60" y1="132" x2="124" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>

    <!-- Bottom-Right Pane (Deep Blue to Navy) -->
    <linearGradient id="paneBR" x1="132" y1="132" x2="196" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#005A9E"/>
      <stop offset="100%" stop-color="#004275"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="tileShadow" x="48" y="52" width="160" height="160" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#001833" flood-opacity="0.35"/>
    </filter>

    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="224" height="224" rx="54" ry="54" fill="url(#bgGrad)"/>
  <!-- Ambient Top Highlight -->
  <rect x="16" y="16" width="224" height="224" rx="54" ry="54" fill="url(#ambientGlow)"/>
  <!-- Subtle Border Stroke -->
  <rect x="16.5" y="16.5" width="223" height="223" rx="53.5" ry="53.5" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Windows 4-Pane Fluent Emblem -->
  <g filter="url(#tileShadow)">
    <!-- Top Left -->
    <rect x="62" y="62" width="62" height="62" rx="9" fill="url(#paneTL)"/>
    <!-- Top Right -->
    <rect x="132" y="62" width="62" height="62" rx="9" fill="url(#paneTR)"/>
    <!-- Bottom Left -->
    <rect x="62" y="132" width="62" height="62" rx="9" fill="url(#paneBL)"/>
    <!-- Bottom Right -->
    <rect x="132" y="132" width="62" height="62" rx="9" fill="url(#paneBR)"/>
  </g>
</svg>
