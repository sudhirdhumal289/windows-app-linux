# Builds and packages every frontend on its own OS: GTK on Linux, WinUI 3 on Windows and
# AppKit on macOS. Packages are uploaded as workflow artifacts and published as GitHub Releases.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (GTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev freerdp3-dev libwinpr3-dev
      - name: Fetch FreeRDP 3.32+ Bundle
        run: ./scripts/fetch-freerdp.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - name: Package (.deb)
        run: ./scripts/package.sh deb
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-linux-deb
          path: target/packages/*.deb

  windows:
    name: Windows (WinUI 3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # build.rs automatically downloads the pinned prebuilt FreeRDP SDK in packaging/windows/freerdp-sdk.txt
      - run: cargo clippy --no-default-features --features winui
      - run: cargo test --lib --no-default-features --features winui
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress
      - name: Package (.zip and .exe installer)
        shell: pwsh
        run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-windows-x64
          path: target/packages/windows-x64/*

  macos:
    name: macOS (AppKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FreeRDP via Homebrew
        run: brew install freerdp pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --no-default-features --features appkit
      - run: cargo test --lib --no-default-features --features appkit
      - name: Package (.dmg and .tar.gz)
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-macos
          path: |
            target/packages/macos/*.dmg
            target/packages/macos/*.tar.gz

  # Verifies the packaged app runs headlessly without crashing.
  smoke-test:
    name: Smoke test (Linux)
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-app-linux-deb
          path: target/packages
      - name: Install .deb package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 ./target/packages/*.deb
      - name: Launch headlessly under Xvfb
        run: |
          xvfb-run -a dbus-launch windows-app-linux &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Binary crashed on startup!"
            exit 1
          fi
          kill "$pid"

  release:
    name: Publish Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux package (.deb)
        uses: actions/download-artifact@v4
        with:
          name: windows-app-linux-deb
          path: release-assets
      - name: Download Windows package (.exe, .zip)
        uses: actions/download-artifact@v4
        with:
          name: windows-app-windows-x64
          path: release-assets
      - name: Download macOS package (.dmg, .tar.gz)
        uses: actions/download-artifact@v4
        with:
          name: windows-app-macos
          path: release-assets
      - name: List Release Assets
        run: ls -lh release-assets/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" == v* ]]; then
            TITLE="Windows App ${TAG}"
            PRERELEASE=""
          else
            TAG="continuous"
            TITLE="Continuous Build"
            PRERELEASE="--prerelease"
          fi

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" ${PRERELEASE} \
              --title "${TITLE}" \
              --generate-notes \
              release-assets/*
          else
            gh release upload "${TAG}" release-assets/* --clobber
          fi
