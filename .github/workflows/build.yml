# Builds and packages every frontend on its own OS: GTK on Linux, WinUI 3 on Windows and
# AppKit on macOS. Packages are uploaded as workflow artifacts and published as GitHub Releases.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (GTK - deb, rpm, opensuse, arch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install development & packaging packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev freerdp3-dev libwinpr3-dev libfuse3-dev rpm zstd
          # Provide libfuse3.so.4 compatibility symlink if only libfuse3.so.3 is available
          for f in /usr/lib/x86_64-linux-gnu/libfuse3.so.3* /lib/x86_64-linux-gnu/libfuse3.so.3*; do
            if [ -f "$f" ] && [ ! -f /usr/lib/x86_64-linux-gnu/libfuse3.so.4 ]; then
              sudo ln -sf "$f" /usr/lib/x86_64-linux-gnu/libfuse3.so.4
              sudo /sbin/ldconfig || true
              break
            fi
          done
      - name: Fetch FreeRDP 3.32+ Bundle
        run: |
          ./scripts/fetch-freerdp.sh
          BUNDLE_LIB="$(pwd)/freerdp-3.32/lib/x86_64-linux-gnu"
          if [ -d "$BUNDLE_LIB" ]; then
            echo "$BUNDLE_LIB" | sudo tee /etc/ld.so.conf.d/freerdp-bundle.conf
            sudo /sbin/ldconfig
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - name: Run cargo test
        run: |
          BUNDLE_LIB="$(pwd)/freerdp-3.32/lib/x86_64-linux-gnu"
          if [ -d "$BUNDLE_LIB" ]; then
            export LD_LIBRARY_PATH="$BUNDLE_LIB:${LD_LIBRARY_PATH:-}"
          fi
          cargo test
      - name: Package Linux Distributions (deb, rpm, opensuse, arch)
        run: |
          ./scripts/package-deb.sh
          ./scripts/package-rpm.sh
          ./scripts/package-opensuse.sh
          ./scripts/package-arch.sh
          echo "Generated packages:"
          ls -lh target/packages/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-linux-packages
          path: target/packages/*

  windows:
    name: Windows (WinUI 3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # build.rs automatically downloads the pinned prebuilt FreeRDP SDK in packaging/windows/freerdp-sdk.txt
      - run: cargo clippy --no-default-features --features winui
      - run: cargo test --lib --no-default-features --features winui
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress
      - name: Package (.zip and .exe installer)
        shell: pwsh
        run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-windows-x64
          path: target/packages/windows-x64/*

  macos:
    name: macOS (AppKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FreeRDP via Homebrew
        run: brew install freerdp pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --no-default-features --features appkit
      - run: cargo test --lib --no-default-features --features appkit
      - name: Package (.dmg and .tar.gz)
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-macos
          path: |
            target/packages/macos/*.dmg
            target/packages/macos/*.tar.gz

  # Verifies the packaged app runs headlessly without crashing.
  smoke-test:
    name: Smoke test (Linux)
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-app-linux-packages
          path: target/packages
      - name: Install .deb package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libfuse3-3 ./target/packages/*.deb || sudo apt-get install -y xvfb dbus-x11 ./target/packages/*.deb
          if [ -d /usr/lib/windows-app ]; then
            echo "/usr/lib/windows-app" | sudo tee /etc/ld.so.conf.d/windows-app.conf
            sudo /sbin/ldconfig || true
          fi
          for f in /usr/lib/x86_64-linux-gnu/libfuse3.so.3* /lib/x86_64-linux-gnu/libfuse3.so.3*; do
            if [ -f "$f" ] && [ ! -f /usr/lib/x86_64-linux-gnu/libfuse3.so.4 ]; then
              sudo ln -sf "$f" /usr/lib/x86_64-linux-gnu/libfuse3.so.4
              sudo /sbin/ldconfig || true
              break
            fi
          done
      - name: Launch headlessly under Xvfb
        run: |
          if [ -d /usr/lib/windows-app ]; then
            export LD_LIBRARY_PATH="/usr/lib/windows-app:${LD_LIBRARY_PATH:-}"
          fi
          xvfb-run -a dbus-launch windows-app &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Binary crashed on startup!"
            exit 1
          fi
          kill "$pid"

  release:
    name: Publish Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux packages (.deb, .rpm, .pkg.tar.zst)
        uses: actions/download-artifact@v4
        with:
          name: windows-app-linux-packages
          path: release-assets
      - name: Download Windows package (.exe, .zip)
        uses: actions/download-artifact@v4
        with:
          name: windows-app-windows-x64
          path: release-assets
      - name: Download macOS package (.dmg, .tar.gz)
        uses: actions/download-artifact@v4
        with:
          name: windows-app-macos
          path: release-assets
      - name: List Release Assets
        run: ls -lh release-assets/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" == v* ]]; then
            TITLE="Windows App ${TAG}"
            PRERELEASE=""
          else
            TAG="continuous"
            TITLE="Continuous Build"
            PRERELEASE="--prerelease"
          fi

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" ${PRERELEASE} \
              --title "${TITLE}" \
              --generate-notes \
              release-assets/*
          else
            gh release upload "${TAG}" release-assets/* --clobber
          fi
