<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Remote desktop connection</title>
  <defs>
    <linearGradient id="tile" x1="8" y1="4" x2="120" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#52c7ff"/>
      <stop offset="0.5" stop-color="#1e94ec"/>
      <stop offset="1" stop-color="#0b67cf"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="4" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="6" width="120" height="120" rx="15" fill="#0a4fa3" opacity="0.22"/>
  <rect x="4" y="4" width="120" height="120" rx="15" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="120" rx="15" fill="url(#sheen)"/>

  <!-- Monitor -->
  <rect x="28" y="34" width="72" height="48" rx="7" fill="#ffffff"/>
  <path d="M57 81h14l2 8H55z" fill="#ffffff"/>
  <rect x="44" y="88" width="40" height="7" rx="3.5" fill="#ffffff"/>

  <!-- Two-way arrows cut into the screen -->
  <g fill="none" stroke="url(#tile)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 50h42m-7-7 7 7-7 7"/>
    <path d="M86 66H44m7-7-7 7 7 7"/>
  </g>
</svg>
