[package]
name = "windows-app-linux"
version = "0.1.0"
edition = "2021"
authors = ["Sudhir <sudhir@local>"]
description = "Native client for Microsoft Windows 365 and Azure Virtual Desktop built with Rust, FreeRDP 3 and GTK 4 / libadwaita"
license = "MIT OR Apache-2.0"
build = "build.rs"

[features]
default = ["gtk"]
# GTK 4 / libadwaita / WebKitGTK frontend (Linux). Future native frontends (WinUI, AppKit)
# get their own feature; the core library builds without any of them.
gtk = ["dep:gtk4", "dep:adw", "dep:webkit6"]

[lib]
name = "windows_app_linux"
path = "src/lib.rs"

[[bin]]
name = "windows-app-linux"
path = "src/main.rs"
required-features = ["gtk"]

[dependencies]
# GUI frontend (GTK 4, libadwaita & WebKitGTK 6)
gtk4 = { version = "0.11", features = ["v4_14"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"], optional = true }
webkit6 = { version = "0.6", features = ["v2_42"], optional = true }

# Async runtime & HTTP client
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography & Auth (PKCE, PKeyAuth)
ring = "0.17"
base64 = "0.22"

# Utilities & Error handling
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
url = "2.5"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
roxmltree = "0.21"
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust", "apple-native", "windows-native"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
name = "windows-app-linux"
maintainer = "Windows App for Linux Contributors"
depends = "libgtk-4-1 (>= 4.14), libadwaita-1-0 (>= 1.5), libwebkitgtk-6.0-4 (>= 2.40), libsoup-3.0-0 (>= 3.0), libfreerdp3-3, libfreerdp-client3-3, libwinpr3-3"
section = "utils"
priority = "optional"
assets = [
    ["target/release/windows-app-linux", "usr/bin/", "755"],
    ["assets/com.microsoft.windowsapp.linux.desktop", "usr/share/applications/", "644"],
    ["assets/com.microsoft.windowsapp.linux.search-provider.ini", "usr/share/gnome-shell/search-providers/", "644"],
    ["assets/com.microsoft.windowsapp.linux.service", "usr/share/dbus-1/services/", "644"],
    ["assets/com.microsoft.windowsapp.linux.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["resources/icons/16x16/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["resources/icons/24x24/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["resources/icons/32x32/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["resources/icons/48x48/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["resources/icons/64x64/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["resources/icons/128x128/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["resources/icons/256x256/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["resources/icons/512x512/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"
