[package]
name = "windows-app"
version = "0.2.0"
edition = "2021"
authors = ["Sudhir <sudhir@local>"]
description = "Native client for Windows 365, Azure Virtual Desktop and Remote Desktop built with Rust and FreeRDP 3, with GTK 4 / libadwaita, WinUI 3 and AppKit frontends"
license = "MIT OR Apache-2.0"
build = "build.rs"

[features]
default = ["gtk"]
# One native frontend per platform; the core library builds without any of them.
# GTK 4 / libadwaita / WebKitGTK (Linux).
gtk = ["dep:gtk4", "dep:adw", "dep:webkit6", "dep:gdk4-x11"]
# WinUI 3 through windows-reactor, WebView2 sign-in and a Direct3D/Win32 session view
# (Windows). Build with `--no-default-features --features winui`.
winui = ["dep:windows-reactor", "dep:windows", "dep:webview2-com"]
# AppKit through objc2, WKWebView sign-in (macOS). Build with
# `--no-default-features --features appkit`.
appkit = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-web-kit",
    "dep:objc2-core-graphics",
    "dep:objc2-core-foundation",
    "dep:block2",
    "dep:dispatch2",
]

[lib]
name = "windows_app"
path = "src/lib.rs"

[[bin]]
name = "windows-app"
path = "src/main.rs"

[dependencies]
# GUI frontend (GTK 4, libadwaita & WebKitGTK 6)
gtk4 = { version = "0.11", features = ["v4_14"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"], optional = true }
webkit6 = { version = "0.6", features = ["v2_42"], optional = true }

# Async runtime & HTTP client
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography & Auth (PKCE, PKeyAuth)
ring = "0.17"
base64 = "0.22"

# Utilities & Error handling
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
url = "2.5"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
roxmltree = "0.21"
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust", "apple-native", "windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Workspace placement of session windows on X11 (Wayland has no client API for it).
gdk4-x11 = { version = "0.11", optional = true }

[target.'cfg(windows)'.dependencies]
windows-reactor = { version = "0.100", optional = true }
webview2-com = { version = "0.39", optional = true }
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3", optional = true }
objc2-web-kit = { version = "0.3", optional = true }
objc2-core-graphics = { version = "0.3", optional = true }
objc2-core-foundation = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
name = "windows-app"
maintainer = "Windows App for Linux Contributors"
depends = "libgtk-4-1 (>= 4.14), libadwaita-1-0 (>= 1.5), libwebkitgtk-6.0-4 (>= 2.40), libsoup-3.0-0 (>= 3.0), libfreerdp3-3, libfreerdp-client3-3, libwinpr3-3"
section = "utils"
priority = "optional"
assets = [
    ["target/release/windows-app", "usr/bin/", "755"],
    ["assets/com.microsoft.windowsapp.linux.desktop", "usr/share/applications/", "644"],
    ["assets/com.microsoft.windowsapp.linux.search-provider.ini", "usr/share/gnome-shell/search-providers/", "644"],
    ["assets/com.microsoft.windowsapp.linux.service", "usr/share/dbus-1/services/", "644"],
    ["assets/gnome-shell-extension/windows-app-linux@sudhirdhumal289.github.io/metadata.json", "usr/share/gnome-shell/extensions/windows-app-linux@sudhirdhumal289.github.io/", "644"],
    ["assets/gnome-shell-extension/windows-app-linux@sudhirdhumal289.github.io/extension.js", "usr/share/gnome-shell/extensions/windows-app-linux@sudhirdhumal289.github.io/", "644"],
    ["assets/com.microsoft.windowsapp.linux.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["resources/icons/16x16/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["resources/icons/24x24/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["resources/icons/32x32/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["resources/icons/48x48/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["resources/icons/64x64/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["resources/icons/128x128/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["resources/icons/256x256/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["resources/icons/512x512/apps/com.microsoft.windowsapp.linux.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

# Bundles the Windows App SDK runtime with WinUI builds, so users install nothing.
[target.'cfg(windows)'.build-dependencies]
windows-reactor-setup = "0.100"
